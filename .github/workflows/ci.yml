name: CI/CD

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: Lint, Test & Smoke Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check (compile all Python files)
        run: python -m compileall -q analytics.py app.py

      - name: Run analytics self-test
        run: python analytics.py

      - name: Smoke check app imports cleanly
        run: |
          python - <<'EOF'
          import sys

          # Import analytics (core logic)
          import analytics
          print("analytics.py: OK")

          # Verify the dataset required by the app is present
          from pathlib import Path
          data_file = Path("data") / "ecommerce_orders_dataset.csv"
          assert data_file.exists(), f"Missing dataset: {data_file}"
          print(f"dataset: OK ({data_file})")

          # Verify app.py references the analytics module
          src = Path("app.py").read_text(encoding="utf-8")
          assert "import analytics" in src, "app.py must import analytics"
          print("app.py: structure OK")
          print("Smoke check passed.")
          EOF

  build-report:
    name: Regenerate Analytics Report (Artifact)
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run analytics pipeline
        run: python analytics.py

      - name: Upload reports as artifact
        uses: actions/upload-artifact@v4
        with:
          name: analytics-reports
          path: reports/
          retention-days: 14

  deploy:
    name: Deployment (placeholder)
    runs-on: ubuntu-latest
    needs: [ci, build-report]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to Streamlit Community Cloud
        run: |
          echo "Streamlit Community Cloud deploys automatically from the main branch."
          echo "Connect your repo at https://share.streamlit.io and CI will guard main."
          echo "For custom deployments, add your deployment steps here (e.g. Docker, AWS, Azure)."
